<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar Avistamiento - BIO PY</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: forestgreen;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .container {
      background: rgba(0, 0, 0, 0.65);
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 20px;
      color: #E8F5E9;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="text"], textarea {
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background-color: #f4f4f4;
      font-family: inherit;
      font-size: 0.9em;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    input[type="file"] {
      margin-top: 8px;
    }

    .boton {
      display: block;
      width: 100%;
      margin-top: 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    .boton:hover {
      background-color: #45a049;
    }

    .volver {
      margin-top: 10px;
      background-color: #ff9800;
    }

    .volver:hover {
      background-color: #e68900;
    }

    .mensaje {
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¡Reporta tu avistamiento!</h1>
    <form id="reporteForm">
      <label for="descripcion">Descripción del avistamiento:</label>
      <textarea id="descripcion" placeholder="Ejemplo: Vi un tucán cerca del río Paraguay..."></textarea>

      <label for="ubicacion">Ubicación (opcional):</label>
      <input type="text" id="ubicacion" placeholder="Ejemplo: Asunción, Parque Ñu Guasu">

      <label for="archivo">Subir foto o video:</label>
      <input type="file" id="archivo" accept="image/*,video/*">

      <button class="boton" type="submit">ENVIAR REPORTE</button>
      <button class="boton volver" type="button" onclick="history.back()">VOLVER</button>
    </form>
    <p id="mensaje" class="mensaje"></p>
  </div>

 <script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwhFyXOqq3xe3sEMVnL1NZ8Ep1LDrlaHIEgv5gbVycNULmxIq8eqrn88O_mUMStogqYAA/exec";

document.getElementById("reporteForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const descripcion = document.getElementById("descripcion").value;
  const ubicacion = document.getElementById("ubicacion").value;
  const archivoInput = document.getElementById("archivo");
  const mensaje = document.getElementById("mensaje");

  mensaje.textContent = "Enviando reporte...";

  let archivoBase64 = "";
  let nombreArchivo = "";

  if (archivoInput.files.length > 0) {
    const file = archivoInput.files[0];
    nombreArchivo = file.name;
    const reader = new FileReader();
    archivoBase64 = await new Promise((resolve) => {
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.readAsDataURL(file);
    });
  }

  const data = {
    descripcion,
    ubicacion,
    archivo: archivoBase64,
    nombre: nombreArchivo
  };

  try {
    const res = await fetch(scriptURL, {
      method: "POST",
      body: JSON.stringify(data),
    });

    if (res.ok) {
      const json = await res.json();
      mensaje.innerHTML = `✅ ¡Reporte enviado correctamente!<br><a href="${json.link}" target="_blank" style="color:#aef;">Ver archivo</a>`;
      document.getElementById("reporteForm").reset();
    } else {
      mensaje.textContent = "⚠️ Error al enviar el reporte.";
    }
  } catch (error) {
    mensaje.textContent = "❌ No se pudo conectar con el servidor.";
  }
});
</script>
